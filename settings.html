<!DOCTYPE html>
<html lang="en">
<head>
  <!-- إعدادات الصفحة -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Settings - MeloWave</title>

  <!-- ملفات التنسيق الخارجية -->
  <link rel="stylesheet" href="Settings.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"/>
</head>

<body>
  <!-- الهيدر (رأس الصفحة) -->
  <header>
    <h2><a href="#" class="logo">MeloWave</a></h2>
    <ul>
      <li><a href="Home.html">Home</a></li>
      <li><a href="index.html">Explore</a></li>
      <li><a href="Playlists.html">Playlists</a></li>
      <li><a href="Log In.html">Log In</a></li>
      <li><a href="settings.html" class="active">Settings</a></li>
    </ul>
  </header>

  <!-- محتوى الصفحة -->
  <div class="container">
    <h1 class="title">Settings</h1>
    
    <!-- إعدادات الحساب -->
    <div class="section">
      <h2>Account Settings</h2>
      <div class="item">Change Username</div>
      <div class="item">Change Password</div>
      <div class="item">Change Email</div>
    </div>

    <!-- التفضيلات -->
    <div class="section">
      <h2>Preferences</h2>

      <!-- زر تفعيل الوضع المظلم -->
      <div class="item toggle">
        <span id="modeLabel">Dark Mode</span>
        <label class="switch">
          <input type="checkbox" id="darkModeToggle">
          <span class="slider"></span>
        </label>
      </div>

      <div class="item">Language</div>
      <div class="item">Notifications</div>
    </div>

    <!-- إعدادات أخرى -->
    <div class="section">
      <h2>Other</h2>
      <div class="item">Privacy Policy</div>
    </div>
  </div>

  <!-- زر حفظ التغييرات -->
  <button class="save-btn">Save Changes</button>

  <!-- ملف الجافاسكريبت لتفعيل الوضع المظلم -->
  <script src="theme.js"></script>
</body>
</html>
